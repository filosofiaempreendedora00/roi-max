[project]
name = "roimax"
version = "0.1.0"
description = "Motor de sinais de assimetria de odds para Betfair Exchange"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["roimax*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
